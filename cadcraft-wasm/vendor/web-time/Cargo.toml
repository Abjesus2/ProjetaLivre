# Substituto mínimo do web-time para a ponte do ProjetaLivre: o acadrust só mede a duração das
# etapas (para registro) e carimba um "sheet set" com a hora. No WebAssembly sem wasm-bindgen
# não há relógio; tudo devolve zero, e o módulo fica sem nenhuma importação de JavaScript.
[package]
name = "web-time"
version = "1.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
